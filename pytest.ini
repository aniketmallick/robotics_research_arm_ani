[pytest]
# tests/out/ is the scratch directory every smoke test writes to (frames, probe
# images, annotated detections) and is gitignored. Reviewers also drop working
# copies of source and test files in there. pytest would happily collect those
# copies: on 2026-07-19 `pytest tests/` reported 250 passing tests when there
# were 125, because tests/out/rv4/ held a duplicate of every test module.
#
# A doubled count is the harmless symptom. The dangerous one is a stale copy
# passing or failing on code that no longer exists, in a directory nobody thinks
# of as source. Never collect from there.
norecursedirs = out .git __pycache__ *.egg-info
testpaths = tests
