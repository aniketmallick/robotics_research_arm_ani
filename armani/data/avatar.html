<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARM-ANI</title>
<style>
  :root{
    --g1:#d6f5e3; --g2:#eaf9f0; --g3:#c3efd8;
    --leaf1:#3d915f; --leaf2:#57b87b; --leaf3:#7fd39b;
    --bark:#9a6b46; --bark-d:#7c5537;
    --ink:#1e3a2b; --muted:#5a7a68;
    --glass:rgba(255,255,255,.45); --glassborder:rgba(255,255,255,.7);
    --accent:#2f9e63; --listen:#37a0d6; --act:#e08a2b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(120% 90% at 20% 10%, #eafaf1 0%, rgba(234,250,241,0) 60%),
      radial-gradient(130% 100% at 85% 90%, #cdefdd 0%, rgba(205,239,221,0) 55%),
      linear-gradient(160deg, #dff6e9 0%, #f3fbf6 45%, #e6f7ee 100%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
  }
  /* floating soft blobs for depth */
  .blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0;animation:drift 18s ease-in-out infinite}
  .blob.b1{width:340px;height:340px;background:#bfeccf;top:-80px;left:-60px}
  .blob.b2{width:420px;height:420px;background:#d8f3e4;bottom:-120px;right:-80px;animation-delay:-6s}
  .blob.b3{width:240px;height:240px;background:#c9f0da;top:40%;left:70%;animation-delay:-11s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-24px) scale(1.08)}}

  .stage{position:relative;z-index:2;width:min(92vw,520px);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vh,34px)}

  /* glass card holding the avatar */
  .card{
    position:relative;width:min(80vw,340px);aspect-ratio:1/1;border-radius:50%;
    background:var(--glass);
    border:1.5px solid var(--glassborder);
    box-shadow:0 20px 60px -22px rgba(46,120,80,.45), inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .4s, border-color .4s, transform .4s;
  }
  /* concentric listening rings */
  .rings{position:absolute;inset:0;border-radius:50%;pointer-events:none}
  .rings span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--listen);opacity:0}
  body.listening .rings span{animation:ripple 1.8s ease-out infinite}
  body.listening .rings span:nth-child(2){animation-delay:.6s}
  body.listening .rings span:nth-child(3){animation-delay:1.2s}
  @keyframes ripple{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.4);opacity:0}}

  body.listening .card{border-color:rgba(55,160,214,.6);box-shadow:0 0 0 6px rgba(55,160,214,.12),0 20px 60px -22px rgba(55,160,214,.5)}
  body.talking .card{border-color:rgba(47,158,99,.6);box-shadow:0 0 0 6px rgba(47,158,99,.12),0 20px 60px -22px rgba(47,158,99,.5)}
  body.doing .card{border-color:rgba(224,138,43,.6);box-shadow:0 0 0 6px rgba(224,138,43,.14),0 20px 60px -22px rgba(224,138,43,.5)}

  /* avatar */
  .avatar{width:74%;height:74%;overflow:visible}
  .tree{transform-origin:50% 92%;animation:sway 4.5s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  body.listening .tree{animation:leanIn .5s ease forwards}
  @keyframes leanIn{to{transform:translateY(-6px) scale(1.03)}}
  body.talking .tree{animation:talkBounce .5s ease-in-out infinite}
  @keyframes talkBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  body.doing .tree{animation:busy 1.1s ease-in-out infinite}
  @keyframes busy{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  .leaf{transform-origin:50% 100%;animation:rustle 3.2s ease-in-out infinite}
  .leaf.l2{animation-delay:-1s} .leaf.l3{animation-delay:-2s}
  @keyframes rustle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  /* eyes */
  .eye .lid{transform-origin:center;transform:scaleY(1);animation:blink 4.6s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
  body.listening .pupil{transform:translateY(-1px) scale(1.15)}
  .pupil{transition:transform .3s}

  /* mouth: swapped by state via opacity */
  .mouth-shape{transition:opacity .2s}
  .m-idle{opacity:1} .m-open{opacity:0}
  body.talking .m-idle{opacity:0}
  body.talking .m-open{opacity:1;animation:speak .28s ease-in-out infinite}
  @keyframes speak{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.1)}}
  .m-open{transform-origin:center;transform-box:fill-box}

  /* arms wave during doing */
  .arm{transform-origin:top center;transform-box:fill-box}
  body.doing .arm-l{animation:waveL .7s ease-in-out infinite}
  body.doing .arm-r{animation:waveR .7s ease-in-out infinite}
  @keyframes waveL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-22deg)}}
  @keyframes waveR{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(26deg)}}

  /* status text */
  .status{text-align:center;min-height:2.4em}
  .state-label{font-size:clamp(20px,5.5vw,28px);font-weight:800;letter-spacing:-.02em;transition:color .3s}
  body.idle .state-label{color:var(--ink)}
  body.listening .state-label{color:var(--listen)}
  body.thinking .state-label{color:var(--muted)}
  body.talking .state-label{color:var(--accent)}
  body.doing .state-label{color:var(--act)}
  .hint{font-size:clamp(12.5px,3.4vw,15px);color:var(--muted);margin-top:5px;font-weight:500}
  kbd{background:rgba(255,255,255,.75);border:1px solid rgba(46,120,80,.25);border-bottom-width:2px;border-radius:7px;padding:2px 9px;font-family:inherit;font-weight:700;font-size:.92em;color:var(--ink)}

  /* thinking dots */
  .dots{display:inline-flex;gap:5px;height:0;overflow:visible;vertical-align:middle}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.3;animation:think 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes think{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-5px)}}

  /* waveform while talking */
  .wave{display:flex;align-items:flex-end;gap:4px;height:26px;opacity:0;transition:opacity .3s}
  body.talking .wave,body.listening .wave{opacity:1}
  .wave b{width:4px;border-radius:3px;background:var(--accent);height:30%;animation:vu .6s ease-in-out infinite}
  body.listening .wave b{background:var(--listen)}
  .wave b:nth-child(1){animation-delay:-.4s}.wave b:nth-child(2){animation-delay:-.2s}
  .wave b:nth-child(3){animation-delay:-.5s}.wave b:nth-child(4){animation-delay:-.1s}
  .wave b:nth-child(5){animation-delay:-.3s}.wave b:nth-child(6){animation-delay:-.15s}.wave b:nth-child(7){animation-delay:-.35s}
  @keyframes vu{0%,100%{height:22%}50%{height:100%}}

  /* push-to-talk button */
  .ptt{
    position:relative;width:clamp(74px,20vw,92px);height:clamp(74px,20vw,92px);border-radius:50%;
    border:1.5px solid var(--glassborder);
    background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(210,240,224,.5));
    box-shadow:0 12px 30px -12px rgba(46,120,80,.5), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s, box-shadow .2s, background .2s;color:var(--accent);
  }
  .ptt:active,.ptt.held{transform:scale(.93);background:linear-gradient(160deg,#37a0d6,#2f9e63);color:#fff;box-shadow:0 0 0 8px rgba(55,160,214,.15),0 10px 24px -10px rgba(55,160,214,.6)}
  .ptt svg{width:44%;height:44%}
  .ptt-label{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600;text-align:center}

  .brand{position:fixed;top:18px;left:0;right:0;text-align:center;z-index:3;font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--muted)}
  .brand b{color:var(--accent)}
  @media(max-height:560px){.card{width:min(46vh,240px)} .brand{display:none}}
</style>
</head>
<body class="idle">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="brand">ARM&nbsp;·&nbsp;<b>ANI</b></div>

  <div class="stage">
    <div class="card">
      <div class="rings"><span></span><span></span><span></span></div>
      <svg class="avatar" viewBox="0 0 200 200" aria-label="ARM-ANI mascot">
        <!-- ground -->
        <ellipse cx="100" cy="185" rx="52" ry="9" fill="#bfe6cd" opacity=".7"/>
        <g class="tree">
          <!-- arms -->
          <g class="arm arm-l"><path d="M70 120 Q46 116 40 98" stroke="var(--bark)" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="39" cy="96" r="9" fill="var(--leaf2)"/></g>
          <g class="arm arm-r"><path d="M130 120 Q154 116 160 98" stroke="var(--bark)" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="161" cy="96" r="9" fill="var(--leaf2)"/></g>
          <!-- trunk -->
          <path d="M84 176 Q80 130 88 104 L112 104 Q120 130 116 176 Q100 184 84 176 Z" fill="var(--bark)"/>
          <path d="M94 168 Q92 140 96 116" stroke="var(--bark-d)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
          <!-- canopy -->
          <g>
            <circle class="leaf l1" cx="100" cy="70" r="40" fill="var(--leaf1)"/>
            <circle class="leaf l2" cx="72" cy="82" r="30" fill="var(--leaf2)"/>
            <circle class="leaf l3" cx="128" cy="82" r="30" fill="var(--leaf2)"/>
            <circle class="leaf l2" cx="100" cy="52" r="30" fill="var(--leaf3)"/>
            <circle cx="88" cy="64" r="6" fill="#fff" opacity=".35"/>
          </g>
          <!-- face -->
          <g transform="translate(0,4)">
            <!-- cheeks -->
            <circle cx="82" cy="130" r="7" fill="#f7b3a0" opacity=".55"/>
            <circle cx="118" cy="130" r="7" fill="#f7b3a0" opacity=".55"/>
            <!-- eyes -->
            <g class="eye"><circle cx="88" cy="120" r="9" fill="#fff"/><g class="lid" style="transform-origin:88px 120px"><circle cx="88" cy="120" r="9" fill="#fff"/><circle class="pupil" cx="89" cy="121" r="4.4" fill="#243c2e" style="transform-origin:89px 121px"/></g></g>
            <g class="eye"><circle cx="112" cy="120" r="9" fill="#fff"/><g class="lid" style="transform-origin:112px 120px"><circle cx="112" cy="120" r="9" fill="#fff"/><circle class="pupil" cx="113" cy="121" r="4.4" fill="#243c2e" style="transform-origin:113px 121px"/></g></g>
            <!-- mouth -->
            <path class="mouth-shape m-idle" d="M90 138 Q100 146 110 138" stroke="#243c2e" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse class="mouth-shape m-open" cx="100" cy="140" rx="7" ry="6" fill="#3a5a45"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="status">
      <div class="state-label" id="label">Ready</div>
      <div class="hint" id="hint">Hold <kbd>Space</kbd> to talk</div>
      <div class="wave" style="justify-content:center;margin-top:10px"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center">
      <button class="ptt" id="ptt" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11Z"/></svg>
      </button>
      <div class="ptt-label" id="pttLabel">or hold this</div>
    </div>
  </div>

<script>
(function(){
  const body = document.body;
  const label = document.getElementById('label');
  const hint  = document.getElementById('hint');
  const ptt   = document.getElementById('ptt');
  const pttLabel = document.getElementById('pttLabel');

  const isTouch = matchMedia('(hover:none)').matches;
  const DOTS = '<span class="dots"><i></i><i></i><i></i></span>';

  const COPY = {
    idle:     ['Ready',       isTouch ? 'Hold the button to talk' : 'Hold <kbd>Space</kbd> to talk'],
    listening:['Listening',   'I’m all ears…'],
    thinking: ['Thinking',    'Working it out ' + DOTS],
    talking:  ['Talking',     'Here’s the thing…'],
    doing:    ['On it',       'Moving the arm ' + DOTS],
  };

  let state = 'idle';
  let timers = [];
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function set(next){
    ['idle','listening','thinking','talking','doing'].forEach(s=>body.classList.remove(s));
    body.classList.add(next);
    state = next;
    label.innerHTML = COPY[next][0];
    hint.innerHTML  = COPY[next][1];
  }

  // DEMO MODE: ?demo=1 drives the animation from a canned timeline so the face
  // can be shown with no agent running. Without it the page is a pure mirror of
  // what the agent publishes, and never invents a state.
  const DEMO = new URLSearchParams(location.search).has('demo');

  // ---- interaction: hold to listen, release to run ----
  let holding = false;
  function startListening(){
    if(holding) return;
    holding = true; clearTimers();
    ptt.classList.add('held');
    // In demo mode the button drives the face directly. Live, the spacebar
    // already reaches the agent through its own global listener, and the agent
    // publishes 'listening' — so the page just waits to be told, rather than
    // asserting a state the robot may not actually be in.
    if(DEMO) set('listening');
  }
  function stopListening(){
    if(!holding) return;
    holding = false;
    ptt.classList.remove('held');
    if(DEMO) runPreviewReply();
  }

  function runPreviewReply(){
    set('thinking');
    timers.push(setTimeout(()=>set('talking'), 900));
    timers.push(setTimeout(()=>set('doing'),  3400));   // omit if the turn has no action
    timers.push(setTimeout(()=>set('idle'),   5600));
  }

  // ---- the real feed: mirror what the agent publishes ----
  const STATES = ['idle','listening','thinking','talking','doing'];
  const POLL_MS = 125;                      // 8x/second
  let missed = 0;

  async function poll(){
    try{
      const res = await fetch('/state', {cache:'no-store'});
      const s = await res.json();
      missed = 0;
      // Anything unrecognised (or stale, which the server already reports as
      // idle) settles the face rather than freezing it mid-sentence.
      const next = STATES.includes(s.state) ? s.state : 'idle';
      if(next !== state) set(next);
    }catch(err){
      // No server yet, or it went away. Fall back to idle rather than leaving
      // the mascot talking to an empty room — but only after a few misses, so
      // one dropped poll on a phone's wifi doesn't cause a flicker.
      if(++missed > 8 && state !== 'idle') set('idle');
    }
    setTimeout(poll, POLL_MS);
  }
  if(!DEMO) poll();

  // keyboard (desktop): spacebar, ignore auto-repeat
  addEventListener('keydown', e=>{
    if(e.code==='Space' && !e.repeat){ e.preventDefault(); startListening(); }
  });
  addEventListener('keyup', e=>{
    if(e.code==='Space'){ e.preventDefault(); stopListening(); }
  });

  // button (mobile + desktop): pointer events cover mouse + touch
  ptt.addEventListener('pointerdown', e=>{ e.preventDefault(); startListening(); });
  ptt.addEventListener('pointerup',   e=>{ e.preventDefault(); stopListening(); });
  ptt.addEventListener('pointercancel', stopListening);
  ptt.addEventListener('pointerleave', e=>{ if(holding) stopListening(); });
  addEventListener('contextmenu', e=>{ if(holding) e.preventDefault(); });

  if(isTouch){ hint.innerHTML = 'Hold the button to talk'; pttLabel.textContent = 'hold to talk'; }

  /* =====================================================================
     Served by scripts/run_avatar.py. /state is armani/uistate.current(),
     written by the agent on each transition and by the motion worker when a
     job starts and stops.

     The on-screen button is a visual affordance only in live mode: it is a
     SEPARATE PROCESS from the voice session and has no handle on the realtime
     socket, so it cannot open the mic. The spacebar does, through the agent's
     own global listener. Wiring the button would need a command channel back
     into run_agent.py — new IPC, in a presentation-only stage, next to the
     push-to-talk path the whole demo depends on. Not worth it.
  ===================================================================== */
})();
</script>
</body>
</html>
